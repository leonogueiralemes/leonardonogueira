<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leonardo Nogueira — Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #181818;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.18);
      --text: #efefef;
      --text-muted: #777;
      --text-faint: #333;
      --green: #6ee7b7;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --ease: 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 320px;
      background: radial-gradient(ellipse, rgba(255,255,255,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: 22px;
      padding: 38px 28px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 80px rgba(0,0,0,0.7);
    }

    .avatar-wrap { position: relative; margin-bottom: 22px; }

    .avatar-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: conic-gradient(#fff 0deg, #333 180deg, #fff 360deg);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-initials {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -2px;
      user-select: none;
    }

    .badge {
      position: absolute;
      bottom: 0;
      right: -6px;
      background: #0f1f16;
      border: 1px solid rgba(110,231,183,0.35);
      border-radius: 999px;
      padding: 3px 9px 3px 7px;
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 5px;
    }

    .role {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 18px;
    }

    .role strong { color: var(--text); }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 26px;
    }

    .tag {
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 11px;
    }

    .sep {
      width: 100%;
      height: 1px;
      background: var(--border-hover);
      margin-bottom: 20px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 14px;
      font-weight: 600;
      transition: background var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease);
    }

    .btn:hover {
      background: rgba(255,255,255,0.09);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .btn:active { transform: translateY(0); }

    .btn-left { display: flex; align-items: center; gap: 12px; }

    .btn-icon {
      width: 33px; height: 33px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon svg { width: 16px; height: 16px; fill: var(--text); }

    .btn-arrow {
      font-size: 15px;
      color: var(--text-faint);
      transition: color var(--ease);
    }

    .btn:hover .btn-arrow { color: var(--text-muted); }

    .meta {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-faint);
    }

    .location svg { width: 11px; height: 11px; fill: var(--text-faint); }

    .footer-name {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-faint);
      letter-spacing: 0.07em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
